name: Workspace Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI definitions
        run: npm run lint

      - name: Build standalone verification runtime
        run: npm run standalone:build

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: mike-docs-standalone
          path: standalone-dist
