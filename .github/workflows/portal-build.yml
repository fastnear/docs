name: Portal Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      PLAN_GATES: ${{ secrets.PLAN_GATES }}
      REDOCLY_LOCAL_PLAN: enterprise
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI definitions
        run: npm run lint

      - name: Build portal
        run: npm run build

      - name: Upload portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: mike-docs-public
          path: public
