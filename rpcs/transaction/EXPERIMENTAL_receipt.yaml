openapi: 3.1.0
info:
  title: "NEAR Protocol RPC: Get receipt by ID"
  description: Fetch a single receipt by ID — the cross-shard execution unit a transaction produces.
  version: 1.0.0
servers:
  - url: "https://rpc.mainnet.fastnear.com"
    description: Mainnet
  - url: "https://rpc.testnet.fastnear.com"
    description: Testnet
paths:
  /:
    post:
      operationId: EXPERIMENTAL_receipt
      summary: Get receipt by ID
      description: Fetch a single receipt by ID — the cross-shard execution unit a transaction produces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, id, method, params]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  type: string
                  example: fastnear
                method:
                  type: string
                  enum: [EXPERIMENTAL_receipt]
                params:
                  type: object
                  properties:
                    receipt_id:
                      type: string
                      description: Base58-encoded hash
                  required: [receipt_id]
            examples:
              mainnet:
                summary: Get receipt by ID (Mainnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: EXPERIMENTAL_receipt
                  params:
                    receipt_id: FcFKrKQziMPCgYMFiLMZwecBtA7vqxdkatkhc1j3GYj8
              testnet:
                summary: Get receipt by ID (Testnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: EXPERIMENTAL_receipt
                  params:
                    receipt_id: CKajpdRe5MnwjySR6MKKbp6Dr5oEiM5XFcYmu77mvnne
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
  schemas:
    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          properties:
            predecessor_id:
              type: string
              description: NEAR account ID
            priority:
              type: integer
              description: "Deprecated, retained for backward compatibility."
              format: uint64
              default: 0
              minimum: 0
            receipt:
              type: object
              description: One of multiple possible types
            receipt_id:
              type: string
              description: Base58-encoded hash
            receiver_id:
              type: string
              description: NEAR account ID
          required: [predecessor_id, receiver_id, receipt_id, receipt]
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
