openapi: 3.1.0
info:
  title: "NEAR Protocol RPC: Node Metrics"
  description: "Retrieve performance metrics and statistics from a NEAR Protocol node"
  version: "1.0.0"
servers:
  - url: "https://rpc.mainnet.fastnear.com"
    description: "Mainnet"
  - url: "https://rpc.testnet.fastnear.com"
    description: "Testnet"
security:
  - ApiKeyAuth: []
paths:
  /metrics:
    get:
      operationId: metrics
      summary: "Get node metrics"
      description: "Retrieves Prometheus-format node metrics from the HTTP `/metrics` endpoint. Requires an API key."
      responses:
        "200":
          description: "Successful response"
          content:
            text/plain:
              schema:
                type: string
                description: "Prometheus exposition text"
                example: |-
                  # HELP process_cpu_seconds_total Total user and system CPU time spent in seconds.
                  # TYPE process_cpu_seconds_total counter
                  process_cpu_seconds_total 12.34
        "403":
          description: "Missing or invalid API key"
          content:
            text/plain:
              schema:
                type: string
                example: Forbidden
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
