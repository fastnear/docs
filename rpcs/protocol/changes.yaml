openapi: 3.1.0
info:
  title: "NEAR Protocol RPC: Get state changes"
  description: "Fetch detailed state changes in a block — filter by account, key prefix, or change type."
  version: 1.0.0
servers:
  - url: "https://rpc.mainnet.fastnear.com"
    description: Mainnet
  - url: "https://rpc.testnet.fastnear.com"
    description: Testnet
paths:
  /:
    post:
      operationId: changes
      summary: Get state changes
      description: "Fetch detailed state changes in a block — filter by account, key prefix, or change type."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, id, method, params]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  type: string
                  example: fastnear
                method:
                  type: string
                  enum: [changes]
                params:
                  type: object
                  description: One of multiple possible types
            examples:
              mainnet:
                summary: Get state changes (Mainnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: changes
                  params:
                    finality: final
                    changes_type: account_changes
                    account_ids: [root.near]
              testnet:
                summary: Get state changes (Testnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: changes
                  params:
                    finality: final
                    changes_type: account_changes
                    account_ids: [root.testnet]
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
security:
  - BearerAuth: []
  - ApiKeyAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "FastNEAR API key sent as an `Authorization: Bearer` header; recommended when you control the client."
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
      description: "FastNEAR API key as the `apiKey` query parameter; convenient for browsers, but the key appears in URLs and logs."
  schemas:
    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          properties:
            block_hash:
              type: string
              description: Base58-encoded hash
            changes:
              type: array
              items:
                type: object
                properties:
                  cause:
                    type: object
                    description: One of multiple possible types
                required: [cause]
          required: [block_hash, changes]
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
