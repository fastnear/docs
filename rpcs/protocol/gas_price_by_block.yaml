openapi: 3.1.0
info:
  title: "NEAR Protocol RPC: Get gas price by block"
  description: "Fetch the chain-wide gas price at a chosen historical block, by height or hash."
  version: 1.0.0
servers:
  - url: "https://archival-rpc.mainnet.fastnear.com"
    description: Mainnet
  - url: "https://archival-rpc.testnet.fastnear.com"
    description: Testnet
paths:
  /:
    post:
      operationId: gas_price_by_block
      summary: Get gas price by block
      description: "Fetch the chain-wide gas price at a chosen historical block, by height or hash."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, id, method, params]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  type: string
                  example: fastnear
                method:
                  type: string
                  enum: [gas_price]
                params:
                  type: object
                  required: [block_id]
                  properties:
                    block_id:
                      oneOf:
                        - type: integer
                          description: Block height
                        - type: string
                          description: Base58-encoded block hash
                      description: Block height (integer) or block hash (string)
            examples:
              mainnet:
                summary: Get gas price by block (Mainnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: gas_price
                  params:
                    block_id: 9XN7MtDywZvfGx6TKy1MT2iCZkKuHikJXmNazxdZ4x6T
              testnet:
                summary: Get gas price by block (Testnet)
                value:
                  jsonrpc: "2.0"
                  id: fastnear
                  method: gas_price
                  params:
                    block_id: 6JYj6i1FaUCzdoqy41CqUcZJxa5n9EmLEENRDH2gLm5u
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
security:
  - BearerAuth: []
  - ApiKeyAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "FastNEAR API key sent as an `Authorization: Bearer` header; recommended when you control the client."
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
      description: "FastNEAR API key as the `apiKey` query parameter; convenient for browsers, but the key appears in URLs and logs."
  schemas:
    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
          properties:
            gas_price:
              type: string
              description: Amount in yoctoNEAR
          required: [gas_price]
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
