openapi: 3.1.0
info:
  title: "NEAR Protocol RPC: Latest Block"
  description: "Fetch the latest final block — finality set automatically, no block ID needed."
  version: "1.0.0"
servers:
  - url: "https://rpc.mainnet.fastnear.com"
    description: "Mainnet RPC"
  - url: "https://rpc.testnet.fastnear.com"
    description: "Testnet RPC"
  - url: "https://archival-rpc.mainnet.fastnear.com"
    description: "Mainnet Archival RPC"
  - url: "https://archival-rpc.testnet.fastnear.com"
    description: "Testnet Archival RPC"
security:
  - BearerAuth: []
  - ApiKeyAuth: []
paths:
  /:
    post:
      operationId: latest_block
      summary: "Get latest block"
      description: "Fetch the latest final block — finality set automatically, no block ID needed."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - id
                - method
                - params
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  type: string
                  example: "fastnear"
                method:
                  type: string
                  enum: ["block"]
                params:
                  type: object
                  required:
                    - finality
                  properties:
                    finality:
                      type: string
                      enum: ["final", "near-final", "optimistic"]
                      description: "Finality selector for the latest visible block"
            examples:
              mainnet:
                summary: "Mainnet Latest Block"
                value:
                  jsonrpc: "2.0"
                  id: "fastnear"
                  method: "block"
                  params:
                    finality: "optimistic"
              testnet:
                summary: "Testnet Latest Block"
                value:
                  jsonrpc: "2.0"
                  id: "fastnear"
                  method: "block"
                  params:
                    finality: "optimistic"
      responses:
        "200":
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "FastNEAR API key sent as an `Authorization: Bearer` header; recommended when you control the client."
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
      description: "FastNEAR API key as the `apiKey` query parameter; convenient for browsers, but the key appears in URLs and logs."
  schemas:
    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: string
            - type: number
        result:
          type: object
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
