openapi: 3.1.0
info:
  title: Transactions API - Account History
  version: 1.0.0
servers:
  - url: https://tx.main.fastnear.com
    description: Mainnet
paths:
  /v0/account:
    post:
      operationId: get_account
      summary: Fetch account transaction history
      description: Returns account transaction rows, an optional total count on the first page, and an optional resume token.
      tags:
        - account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
            example:
              account_id: intents.near
              is_real_signer: true
              is_success: true
              limit: 50
              desc: true
      responses:
        "200":
          description: Account history result set
          content:
            application/json:
              schema:
                type: object
                required:
                  - account_txs
                properties:
                  txs_count:
                    type: integer
                  account_txs:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountTxRow"
                  resume_token:
                    type: string
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: ClickHouse query failure
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    AccountInput:
      type: object
      additionalProperties: false
      required:
        - account_id
      properties:
        account_id:
          type: string
        is_signer:
          type:
            - boolean
            - "null"
        is_delegated_signer:
          type:
            - boolean
            - "null"
        is_real_signer:
          type:
            - boolean
            - "null"
        is_any_signer:
          type:
            - boolean
            - "null"
        is_predecessor:
          type:
            - boolean
            - "null"
        is_explicit_refund_to:
          type:
            - boolean
            - "null"
        is_receiver:
          type:
            - boolean
            - "null"
        is_real_receiver:
          type:
            - boolean
            - "null"
        is_function_call:
          type:
            - boolean
            - "null"
        is_action_arg:
          type:
            - boolean
            - "null"
        is_event_log:
          type:
            - boolean
            - "null"
        is_success:
          type:
            - boolean
            - "null"
        resume_token:
          type:
            - string
            - "null"
        from_tx_block_height:
          type:
            - integer
            - "null"
          minimum: 0
        to_tx_block_height:
          type:
            - integer
            - "null"
          minimum: 0
        limit:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 200
        desc:
          type:
            - boolean
            - "null"
    AccountTxRow:
      type: object
      additionalProperties: false
      required:
        - account_id
        - transaction_hash
        - tx_block_height
        - tx_block_timestamp
        - tx_index
        - is_signer
        - is_delegated_signer
        - is_real_signer
        - is_any_signer
        - is_predecessor
        - is_explicit_refund_to
        - is_receiver
        - is_real_receiver
        - is_function_call
        - is_action_arg
        - is_event_log
        - is_success
      properties:
        account_id:
          type: string
        transaction_hash:
          type: string
        tx_block_height:
          type: integer
        tx_block_timestamp:
          type: string
        tx_index:
          type: integer
        is_signer:
          type: boolean
        is_delegated_signer:
          type: boolean
        is_real_signer:
          type: boolean
        is_any_signer:
          type: boolean
        is_predecessor:
          type: boolean
        is_explicit_refund_to:
          type: boolean
        is_receiver:
          type: boolean
        is_real_receiver:
          type: boolean
        is_function_call:
          type: boolean
        is_action_arg:
          type: boolean
        is_event_log:
          type: boolean
        is_success:
          type: boolean
    ApiError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
