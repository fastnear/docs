openapi: 3.1.0
info:
  title: Transactions API - Transactions by Hash
  version: 1.0.0
servers:
  - url: https://tx.main.fastnear.com
    description: Mainnet
paths:
  /v0/transactions:
    post:
      operationId: get_transactions
      summary: Fetch transactions by hash
      description: Returns up to 20 raw transaction rows for the supplied transaction hashes.
      tags:
        - transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tx_hashes
              properties:
                tx_hashes:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
            example:
              tx_hashes:
                - HV42hanyDVK3MYoW8c17Ufxw83htNEQGk93bzyQRocvS
                - D2pt9ceGUyiGdJeeZLDd3uBGHF11DmPe4aJFMaoWMmDd
      responses:
        "200":
          description: Matching transactions
          content:
            application/json:
              schema:
                type: object
                required:
                  - transactions
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlockTxRow"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: ClickHouse query failure
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    BlockTxRow:
      type: object
      additionalProperties: false
      required:
        - transaction_hash
        - signer_id
        - tx_block_height
        - tx_index
        - tx_block_hash
        - tx_block_timestamp
        - last_block_height
        - is_completed
        - shard_id
        - receiver_id
        - signer_public_key
        - priority_fee
        - nonce
        - is_relayed
        - real_signer_id
        - real_receiver_id
        - is_success
        - gas_burnt
        - tokens_burnt
      properties:
        transaction_hash:
          type: string
        signer_id:
          type: string
        tx_block_height:
          type: integer
        tx_index:
          type: integer
        tx_block_hash:
          type: string
        tx_block_timestamp:
          type: string
        last_block_height:
          type: integer
        is_completed:
          type: boolean
        shard_id:
          type: integer
        receiver_id:
          type: string
        signer_public_key:
          type: string
        priority_fee:
          type: integer
        nonce:
          type: integer
        is_relayed:
          type: boolean
        real_signer_id:
          type: string
        real_receiver_id:
          type: string
        is_success:
          type: boolean
        gas_burnt:
          type: integer
        tokens_burnt:
          type: string
    ApiError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
