openapi: 3.1.0
info:
  title: FastNEAR API - Status
  version: 1.0.0
servers:
  - url: https://api.fastnear.com
    description: Mainnet
  - url: https://test.api.fastnear.com
    description: Testnet
paths:
  /status:
    get:
      operationId: get_status
      summary: Get sync status
      description: Returns the current sync height, balance sync height, latency, and server version.
      tags:
        - system
      responses:
        "200":
          description: Status payload
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - sync_block_height
                  - sync_latency_sec
                  - sync_block_timestamp_nanosec
                  - sync_balance_block_height
                properties:
                  version:
                    type: string
                  sync_block_height:
                    type:
                      - integer
                      - "null"
                  sync_latency_sec:
                    type:
                      - number
                      - "null"
                  sync_block_timestamp_nanosec:
                    type:
                      - string
                      - "null"
                  sync_balance_block_height:
                    type:
                      - integer
                      - "null"
              example:
                version: 0.10.0
                sync_block_height: 129734103
                sync_latency_sec: 4.671730603
                sync_block_timestamp_nanosec: "1728256282197171397"
                sync_balance_block_height: 129734103
