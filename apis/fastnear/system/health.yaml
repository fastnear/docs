openapi: 3.1.0
info:
  title: FastNEAR API - Health
  version: 1.0.0
servers:
  - url: https://api.fastnear.com
    description: Mainnet
  - url: https://test.api.fastnear.com
    description: Testnet
paths:
  /health:
    get:
      operationId: get_health
      summary: Get service health
      description: Returns `ok` when the service is healthy, otherwise a diagnostic status string.
      tags:
        - system
      responses:
        "200":
          description: Health payload
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
              example:
                status: ok
