openapi: 3.1.0
info:
  title: FastNEAR API - V0 Public Key Lookup All
  version: 1.0.0
servers:
  - url: https://api.fastnear.com
    description: Mainnet
  - url: https://test.api.fastnear.com
    description: Testnet
paths:
  /v0/public_key/{public_key}/all:
    get:
      operationId: lookup_by_public_key_all_v0
      summary: Lookup all accounts by public key
      tags:
        - v0
      parameters:
        - name: public_key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All account IDs for the provided public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKeyLookupResponse"
              example:
                public_key: ed25519:2onv9qxBqs5NYqTuLmotXcQbQGPVXZp537JYd3KFpYxV
                account_ids:
                  - example.near
                  - example-2.near
        "400":
          description: Invalid public key
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Redis or upstream failure
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    PublicKeyLookupResponse:
      $ref: "./public_key_lookup.yaml#/components/schemas/PublicKeyLookupResponse"
