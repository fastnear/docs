openapi: 3.1.0
info:
  title: FastNEAR API - V0 Account Fungible Tokens
  version: 1.0.0
servers:
  - url: https://api.fastnear.com
    description: Mainnet
  - url: https://test.api.fastnear.com
    description: Testnet
paths:
  /v0/account/{account_id}/ft:
    get:
      operationId: account_ft_v0
      summary: Lookup fungible token contracts for an account
      tags:
        - v0
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fungible token contract IDs for the requested account
          content:
            application/json:
              schema:
                type: object
                required:
                  - account_id
                  - contract_ids
                properties:
                  account_id:
                    type: string
                  contract_ids:
                    type: array
                    items:
                      type: string
              example:
                account_id: here.tg
                contract_ids:
                  - wrap.near
                  - usdt.tether-token.near
        "400":
          description: Invalid account ID
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Redis or upstream failure
          content:
            application/json:
              schema:
                type: string
