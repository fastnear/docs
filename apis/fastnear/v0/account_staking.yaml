openapi: 3.1.0
info:
  title: FastNEAR API - V0 Account Staking
  version: 1.0.0
servers:
  - url: https://api.fastnear.com
    description: Mainnet
  - url: https://test.api.fastnear.com
    description: Testnet
paths:
  /v0/account/{account_id}/staking:
    get:
      operationId: account_staking_v0
      summary: Lookup staking pools for an account
      tags:
        - v0
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pool IDs for the requested account
          content:
            application/json:
              schema:
                type: object
                required:
                  - account_id
                  - pools
                properties:
                  account_id:
                    type: string
                  pools:
                    type: array
                    items:
                      type: string
              example:
                account_id: mob.near
                pools:
                  - zavodil.poolv1.near
                  - here.poolv1.near
        "400":
          description: Invalid account ID
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Redis or upstream failure
          content:
            application/json:
              schema:
                type: string
