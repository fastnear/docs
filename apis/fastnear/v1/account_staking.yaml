openapi: 3.1.0
info:
  title: FastNEAR API - V1 Account Staking
  version: 1.0.0
servers:
  - url: https://api.fastnear.com
    description: Mainnet
  - url: https://test.api.fastnear.com
    description: Testnet
paths:
  /v1/account/{account_id}/staking:
    get:
      operationId: account_staking_v1
      summary: Lookup staking pools for an account
      tags:
        - v1
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pool rows for the requested account
          content:
            application/json:
              schema:
                type: object
                required:
                  - account_id
                  - pools
                properties:
                  account_id:
                    type: string
                  pools:
                    type: array
                    items:
                      type: object
                      required:
                        - pool_id
                        - last_update_block_height
                      properties:
                        pool_id:
                          type: string
                        last_update_block_height:
                          type:
                            - integer
                            - "null"
              example:
                account_id: mob.near
                pools:
                  - pool_id: zavodil.poolv1.near
                    last_update_block_height: 114976469
                  - pool_id: here.poolv1.near
                    last_update_block_height: 114976560
        "400":
          description: Invalid account ID
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Redis or upstream failure
          content:
            application/json:
              schema:
                type: string
