openapi: 3.1.0
info:
  title: FastNEAR API - V1 Account Fungible Tokens
  version: 1.0.0
servers:
  - url: https://api.fastnear.com
    description: Mainnet
  - url: https://test.api.fastnear.com
    description: Testnet
paths:
  /v1/account/{account_id}/ft:
    get:
      operationId: account_ft_v1
      summary: Lookup fungible token balances for an account
      tags:
        - v1
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fungible token rows for the requested account
          content:
            application/json:
              schema:
                type: object
                required:
                  - account_id
                  - tokens
                properties:
                  account_id:
                    type: string
                  tokens:
                    type: array
                    items:
                      type: object
                      required:
                        - contract_id
                        - last_update_block_height
                        - balance
                      properties:
                        contract_id:
                          type: string
                        last_update_block_height:
                          type:
                            - integer
                            - "null"
                        balance:
                          type:
                            - string
                            - "null"
              example:
                account_id: here.tg
                tokens:
                  - contract_id: wrap.near
                    last_update_block_height: 115000123
                    balance: "4200000000000000000000000"
                  - contract_id: usdt.tether-token.near
                    last_update_block_height: null
                    balance: null
        "400":
          description: Invalid account ID
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Redis or upstream failure
          content:
            application/json:
              schema:
                type: string
