openapi: 3.1.0
info:
  title: FastNEAR API - V1 Full Account View
  version: 1.0.0
servers:
  - url: https://api.fastnear.com
    description: Mainnet
  - url: https://test.api.fastnear.com
    description: Testnet
paths:
  /v1/account/{account_id}/full:
    get:
      operationId: account_full_v1
      summary: Get the full indexed view for an account
      tags:
        - v1
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregated pools, token balances, NFT contracts, and account state
          content:
            application/json:
              schema:
                type: object
                required:
                  - account_id
                  - pools
                  - tokens
                  - nfts
                  - state
                properties:
                  account_id:
                    type: string
                  pools:
                    type: array
                    items:
                      $ref: "#/components/schemas/PoolRow"
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/TokenRow"
                  nfts:
                    type: array
                    items:
                      $ref: "#/components/schemas/NftRow"
                  state:
                    oneOf:
                      - $ref: "#/components/schemas/AccountState"
                      - type: "null"
              example:
                account_id: here.tg
                pools:
                  - pool_id: here.poolv1.near
                    last_update_block_height: 114976560
                tokens:
                  - contract_id: wrap.near
                    last_update_block_height: 115000123
                    balance: "4200000000000000000000000"
                nfts:
                  - contract_id: nft.genadrop.near
                    last_update_block_height: null
                state:
                  balance: "10500000000000000000000000"
                  locked: "0"
                  storage_bytes: 182
        "400":
          description: Invalid account ID
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Redis or upstream failure
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    PoolRow:
      type: object
      required:
        - pool_id
        - last_update_block_height
      properties:
        pool_id:
          type: string
        last_update_block_height:
          type:
            - integer
            - "null"
    TokenRow:
      type: object
      required:
        - contract_id
        - last_update_block_height
        - balance
      properties:
        contract_id:
          type: string
        last_update_block_height:
          type:
            - integer
            - "null"
        balance:
          type:
            - string
            - "null"
    NftRow:
      type: object
      required:
        - contract_id
        - last_update_block_height
      properties:
        contract_id:
          type: string
        last_update_block_height:
          type:
            - integer
            - "null"
    AccountState:
      type: object
      required:
        - balance
        - locked
        - storage_bytes
      properties:
        balance:
          type: string
        locked:
          type: string
        storage_bytes:
          type: integer
