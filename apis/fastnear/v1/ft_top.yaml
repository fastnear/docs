openapi: 3.1.0
info:
  title: FastNEAR API - V1 Top FT Holders
  version: 1.0.0
servers:
  - url: https://api.fastnear.com
    description: Mainnet
  - url: https://test.api.fastnear.com
    description: Testnet
paths:
  /v1/ft/{token_id}/top:
    get:
      operationId: ft_top_v1
      summary: Get the top holders for a fungible token
      tags:
        - v1
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Top holders for the requested fungible token
          content:
            application/json:
              schema:
                type: object
                required:
                  - token_id
                  - accounts
                properties:
                  token_id:
                    type: string
                  accounts:
                    type: array
                    items:
                      type: object
                      required:
                        - account_id
                        - balance
                      properties:
                        account_id:
                          type: string
                        balance:
                          type:
                            - string
                            - "null"
              example:
                token_id: first.tkn.near
                accounts:
                  - account_id: mob.near
                    balance: "979894691374420631019486155"
                  - account_id: lucky-bastard.near
                    balance: "10319841074196024761995069"
        "400":
          description: Invalid token ID
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Redis or upstream failure
          content:
            application/json:
              schema:
                type: string
