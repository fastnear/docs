openapi: 3.1.0
info:
  title: KV FastData API - History by Predecessor
  version: 1.0.0
servers:
  - url: https://kv.main.fastnear.com
    description: Mainnet
  - url: https://kv.test.fastnear.com
    description: Testnet
paths:
  /v0/history/{current_account_id}/{predecessor_id}:
    post:
      operationId: history_by_predecessor
      summary: Fetch historical key-value writes for one predecessor and contract
      tags:
        - history
      parameters:
        - name: current_account_id
          in: path
          required: true
          schema:
            type: string
        - name: predecessor_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components.yaml#/components/schemas/QueryRequest"
            example:
              key_prefix: settings/
              limit: 50
              include_metadata: false
              asc: false
      responses:
        "200":
          description: Historical rows for the selected predecessor and account
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ListResponse"
              example:
                entries:
                  - predecessor_id: alice.near
                    current_account_id: app.near
                    block_height: 123456789
                    block_timestamp: 1700000000000
                    key: settings/lang
                    value: en
                page_token: eyJrIjoic2V0dGluZ3MvbGFuZyJ9
        "400":
          description: Invalid key filter or page token
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ApiError"
        "500":
          description: Scylla query failure
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ApiError"
