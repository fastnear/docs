openapi: 3.1.0
info:
  title: KV FastData API - Latest by Predecessor
  version: 1.0.0
servers:
  - url: https://kv.main.fastnear.com
    description: Mainnet
  - url: https://kv.test.fastnear.com
    description: Testnet
paths:
  /v0/latest/{current_account_id}/{predecessor_id}:
    post:
      operationId: latest_by_predecessor
      summary: Fetch latest key-value rows for one predecessor and contract
      tags:
        - latest
      parameters:
        - name: current_account_id
          in: path
          required: true
          schema:
            type: string
        - name: predecessor_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components.yaml#/components/schemas/QueryRequest"
            example:
              key_prefix: settings/
              limit: 50
              include_metadata: true
      responses:
        "200":
          description: Latest rows for the selected predecessor and account
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ListResponse"
        "400":
          description: Invalid key filter or page token
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ApiError"
        "500":
          description: Scylla query failure
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ApiError"
