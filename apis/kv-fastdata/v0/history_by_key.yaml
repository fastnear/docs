openapi: 3.1.0
info:
  title: KV FastData API - History by Key
  version: 1.0.0
servers:
  - url: https://kv.main.fastnear.com
    description: Mainnet
  - url: https://kv.test.fastnear.com
    description: Testnet
paths:
  /v0/history:
    post:
      operationId: history_by_key
      summary: Fetch historical rows for a fully qualified key
      tags:
        - history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components.yaml#/components/schemas/ByKeyRequest"
            example:
              key: score
              limit: 50
              include_metadata: false
              asc: false
      responses:
        "200":
          description: Historical rows for the selected key across all accounts
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ListResponse"
        "400":
          description: Invalid key or page token
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ApiError"
        "500":
          description: Scylla query failure
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ApiError"
