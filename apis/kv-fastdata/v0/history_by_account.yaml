openapi: 3.1.0
info:
  title: KV FastData API - History by Account
  version: 1.0.0
servers:
  - url: https://kv.main.fastnear.com
    description: Mainnet
  - url: https://kv.test.fastnear.com
    description: Testnet
paths:
  /v0/history/{current_account_id}:
    post:
      operationId: history_by_account
      summary: Fetch historical key-value writes for one contract across all predecessors
      tags:
        - history
      parameters:
        - name: current_account_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../components.yaml#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Historical rows for the selected contract
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ListResponse"
        "400":
          description: Invalid key filter or page token
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ApiError"
        "500":
          description: Scylla query failure
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ApiError"
