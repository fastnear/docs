openapi: 3.1.0
info:
  title: KV FastData API
  version: 1.0.0
  description: Read-only key-value queries over FastData records stored in ScyllaDB.
servers:
  - url: https://kv.main.fastnear.com
    description: Mainnet
  - url: https://kv.test.fastnear.com
    description: Testnet
paths:
  /v0/history/{current_account_id}/{predecessor_id}:
    $ref: "./v0/history_by_predecessor.yaml#/paths/~1v0~1history~1{current_account_id}~1{predecessor_id}"
  /v0/latest/{current_account_id}/{predecessor_id}:
    $ref: "./v0/latest_by_predecessor.yaml#/paths/~1v0~1latest~1{current_account_id}~1{predecessor_id}"
  /v0/history/{current_account_id}:
    $ref: "./v0/history_by_account.yaml#/paths/~1v0~1history~1{current_account_id}"
  /v0/latest/{current_account_id}:
    $ref: "./v0/latest_by_account.yaml#/paths/~1v0~1latest~1{current_account_id}"
  /v0/all/{predecessor_id}:
    $ref: "./v0/all_by_predecessor.yaml#/paths/~1v0~1all~1{predecessor_id}"
  /v0/history:
    $ref: "./v0/history_by_key.yaml#/paths/~1v0~1history"
  /v0/multi:
    $ref: "./v0/multi.yaml#/paths/~1v0~1multi"
  /v0/history/{current_account_id}/{predecessor_id}/{key}:
    $ref: "./v0/get_history_key.yaml#/paths/~1v0~1history~1{current_account_id}~1{predecessor_id}~1{key}"
  /v0/latest/{current_account_id}/{predecessor_id}/{key}:
    $ref: "./v0/get_latest_key.yaml#/paths/~1v0~1latest~1{current_account_id}~1{predecessor_id}~1{key}"
