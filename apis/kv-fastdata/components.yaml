components:
  schemas:
    QueryRequest:
      type: object
      additionalProperties: false
      properties:
        key:
          type:
            - string
            - "null"
        key_prefix:
          type:
            - string
            - "null"
        limit:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 200
        page_token:
          type:
            - string
            - "null"
        include_metadata:
          type: boolean
          default: false
        asc:
          type: boolean
          default: false
    ByKeyRequest:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          type: string
        limit:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 200
        page_token:
          type:
            - string
            - "null"
        include_metadata:
          type: boolean
          default: false
        asc:
          type: boolean
          default: false
    MultiRequest:
      type: object
      additionalProperties: false
      required:
        - keys
      properties:
        keys:
          type: array
          maxItems: 100
          items:
            type: string
        include_metadata:
          type: boolean
          default: false
    KvEntry:
      type: object
      additionalProperties: true
      required:
        - predecessor_id
        - current_account_id
        - block_height
        - block_timestamp
        - key
        - value
      properties:
        receipt_id:
          type:
            - string
            - "null"
        action_index:
          type:
            - integer
            - "null"
        tx_hash:
          type:
            - string
            - "null"
        signer_id:
          type:
            - string
            - "null"
        predecessor_id:
          type: string
        current_account_id:
          type: string
        block_height:
          type: integer
        block_timestamp:
          type: integer
        key:
          type: string
        value:
          description: Raw JSON value as stored in FastData.
    ListResponse:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/KvEntry"
        page_token:
          type:
            - string
            - "null"
    MultiResponse:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/KvEntry"
              - type: "null"
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
