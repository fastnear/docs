components:
  parameters:
    ApiKeyParam:
      name: apiKey
      in: query
      required: false
      schema:
        type: string
      description: Optional FastNear subscription API key.
    BlockHeightParam:
      name: block_height
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    ShardIdParam:
      name: shard_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
  schemas:
    BlockDocument:
      type:
        - object
        - "null"
      description: Full block document as served by neardata, including `block` and `shards`.
      additionalProperties: true
    HeadersDocument:
      type:
        - object
        - "null"
      description: Block header object extracted from the full block response.
      additionalProperties: true
    ChunkDocument:
      type:
        - object
        - "null"
      description: Chunk object for the requested shard.
      additionalProperties: true
    ShardDocument:
      type:
        - object
        - "null"
      description: Shard object for the requested shard.
      additionalProperties: true
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    ApiError:
      type: object
      required:
        - error
        - type
      properties:
        error:
          type: string
        type:
          type: string
