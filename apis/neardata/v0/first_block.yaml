openapi: 3.1.0
info:
  title: NEAR Data API - First Block
  version: 1.0.0
servers:
  - url: https://mainnet.neardata.xyz
    description: Mainnet
  - url: https://testnet.neardata.xyz
    description: Testnet
paths:
  /v0/first_block:
    get:
      operationId: get_first_block
      summary: Redirect to the first block after genesis
      tags:
        - redirects
      parameters:
        - $ref: "../components.yaml#/components/parameters/ApiKeyParam"
      responses:
        "200":
          description: Block document returned by clients that automatically follow the redirect
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/BlockDocument"
        "302":
          description: Redirects to the canonical first block URL
          headers:
            Location:
              schema:
                type: string
