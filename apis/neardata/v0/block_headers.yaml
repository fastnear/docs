openapi: 3.1.0
info:
  title: NEAR Data API - Block Headers
  version: 1.0.0
servers:
  - url: https://mainnet.neardata.xyz
    description: Mainnet
  - url: https://testnet.neardata.xyz
    description: Testnet
paths:
  /v0/block/{block_height}/headers:
    get:
      operationId: get_block_headers
      summary: Fetch only the block headers for a finalized block
      tags:
        - blocks
      parameters:
        - $ref: "../components.yaml#/components/parameters/BlockHeightParam"
        - $ref: "../components.yaml#/components/parameters/ApiKeyParam"
      responses:
        "200":
          description: Header object for the selected block, or `null` when the block is missing
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/HeadersDocument"
        "404":
          description: Block height is out of range or too far in the future
          content:
            application/json:
              schema:
                $ref: "../components.yaml#/components/schemas/ApiError"
