extends:
  - recommended
ignore:
  - .claude/**
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - API_DOCS_ROLLOUT.md
  - INTEGRATION_GUIDE.md
  - NETWORK_SYNC.md
  - PORTAL_WORKFLOW.md
  - SERVICE_ONBOARDING_CHECKLIST.md
redirects:
  /apis/fastnear/v1/public_key_lookup:
    to: /apis/fastnear/openapi/public-key/lookup_by_public_key_v1
    type: 302
  /apis/neardata/v0/block:
    to: /apis/neardata/openapi/blocks/get_block
    type: 302
  /apis/neardata/v0/block_headers:
    to: /apis/neardata/openapi/blocks/get_block_headers
    type: 302
  /apis/neardata/v0/block_chunk:
    to: /apis/neardata/openapi/blocks/get_chunk
    type: 302
  /apis/neardata/v0/block_shard:
    to: /apis/neardata/openapi/blocks/get_shard
    type: 302
  /apis/neardata/v0/block_optimistic:
    to: /apis/neardata/openapi/blocks/get_block_optimistic
    type: 302
  /apis/neardata/v0/first_block:
    to: /apis/neardata/openapi/blocks/get_first_block
    type: 302
  /apis/neardata/v0/last_block_final:
    to: /apis/neardata/openapi/blocks/get_last_block_final
    type: 302
  /apis/neardata/v0/last_block_optimistic:
    to: /apis/neardata/openapi/blocks/get_last_block_optimistic
    type: 302
  /reference/operation/view_account:
    to: /rpcs/account/view_account/other/view_account
    type: 302
  /reference/operation/block_by_height:
    to: /rpcs/block/block_by_height/other/block_by_height
    type: 302
  /reference/operation/block_by_id:
    to: /rpcs/block/block_by_id/other/block_by_id
    type: 302
  /reference/operation/block_effects:
    to: /rpcs/block/block_effects/other/block_effects
    type: 302
rules:
  security-defined: 'off'
  operation-4xx-response: 'off'
  info-license: 'off'
openapi:
  showExtensions: true
  hideReplay: false
  hideSchemaTitles: true
  hideInfoMetadata: false
  hidePropertiesPrefix: false
  sortRequiredPropsFirst: true
  codeSamples:
    skipOptionalParameters: false
    languages:
      - lang: curl
        label: curl
markdown:
  lastUpdatedBlock:
    format: long
    locale: en-US
    hide: true
sidebar:
  hide: true
navbar:
  hide: true
feedback:
  hide: true
search:
  hide: false
colorMode:
  modes:
    - light
    - dark
scripts:
  head:
    - src: ./scripts/dark-mode.js
    - src: ./scripts/generated-operation-routes.js
    - src: ./scripts/api-operation-redirect.js
    - src: ./scripts/curl-postprocess.js
scorecard:
  ignore:
    - .claude/**
    - rpcs/*.yaml
    - apis/openapi.yaml
    - apis/*/openapi.yaml
apis:
  fastnear:
    root: apis/fastnear/openapi.yaml
    openapi:
      hideDownloadButtons: true
      expandDefaultServerVariables: true
      expandResponses: all
      layout: stacked
      schemaExpansionLevel: 0
      showConsole: true
      hideSidebar: true
  transactions:
    root: apis/transactions/openapi.yaml
    openapi:
      hideDownloadButtons: true
      expandDefaultServerVariables: true
      expandResponses: all
      layout: stacked
      schemaExpansionLevel: 0
      showConsole: true
      hideSidebar: true
  transfers:
    root: apis/transfers/openapi.yaml
    openapi:
      hideDownloadButtons: true
      expandDefaultServerVariables: true
      expandResponses: all
      layout: stacked
      schemaExpansionLevel: 0
      showConsole: true
      hideSidebar: true
  kv-fastdata:
    root: apis/kv-fastdata/openapi.yaml
    openapi:
      hideDownloadButtons: true
      expandDefaultServerVariables: true
      expandResponses: all
      layout: stacked
      schemaExpansionLevel: 0
      showConsole: true
      hideSidebar: true
  neardata:
    root: apis/neardata/openapi.yaml
    openapi:
      hideDownloadButtons: true
      expandDefaultServerVariables: true
      expandResponses: all
      layout: stacked
      schemaExpansionLevel: 0
      showConsole: true
      hideSidebar: true
  rpc:
    root: rpcs/openapi.yaml
    openapi:
      hideDownloadButtons: true
      expandDefaultServerVariables: true
      layout: stacked
      schemaExpansionLevel: 0
      showConsole: true
      hideSidebar: true
mockServer:
  position: 'off'
codeSnippet:
  report:
    hide: true
breadcrumbs:
  hide: true
navigation:
  previousButton:
    hide: true
  nextButton:
    hide: true
